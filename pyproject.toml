[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "etcode"
description = "An AI coding assistant for your terminal (OpenAI, Gemini, Claude) that can edit your files with your approval."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
version = "0.5.0"
dependencies = ["litellm", "rich", "prompt_toolkit", "InquirerPy", "flask", "mcp"]

[project.scripts]
etcode = "etcode.cli:run"

[tool.setuptools]
packages = ["etcode"]

[tool.setuptools.package-data]
etcode = ["templates/*.html"]
